<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Menu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap">
<style>
:root{--bg:#05030a;--p:#8b3dff;--p2:#c084fc;--card:rgba(14,7,26,.78);--tx:#f3eaff;--mut:#a995c9;--bad:#ff5d7a;--ok:#4ade80;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif}
body{min-height:100vh}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 50% 0,rgba(139,61,255,.28),transparent 60%)}
#bg svg{width:100%;height:100%}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:14px 14px 130px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h1{font-size:1.4rem;margin:0;color:var(--p2);text-shadow:0 0 18px var(--p)}
h2{font-size:1.1rem;margin:0 0 10px}
.tag{padding:3px 12px;border-radius:99px;font-size:.8rem;font-weight:700;border:1px solid}
.on{color:var(--ok);border-color:var(--ok)}.off{color:var(--bad);border-color:var(--bad)}
.box{background:var(--card);border:1px solid #5b21b6;border-radius:16px;padding:16px;margin-bottom:12px;backdrop-filter:blur(3px)}
.ban{border-color:var(--bad);color:#ffc2cd}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #6d28d9;background:rgba(5,3,10,.8);color:var(--tx);font:inherit}
input[type=checkbox]{width:auto}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 18px;color:#fff;background:linear-gradient(135deg,#7c3aed,#a855f7);font-weight:700;box-shadow:0 0 14px rgba(139,61,255,.5)}
button:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
button.g{background:transparent;border:1px solid #6d28d9;box-shadow:none;color:var(--p2)}
button.d{background:#7f1d3a;box-shadow:none;padding:6px 10px;font-size:.8rem}
.full{width:100%;margin-top:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{padding:18px 8px;font-size:1.05rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.chip{white-space:nowrap;padding:6px 14px;border-radius:99px;border:1px solid #6d28d9;background:rgba(5,3,10,.7);color:var(--p2);box-shadow:none}
.chip.a{background:#7c3aed;color:#fff}
.card{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #4c1d95;border-radius:14px;margin-bottom:8px;background:var(--card);cursor:pointer}
.card.sel{border-color:var(--p2);box-shadow:0 0 14px rgba(168,85,247,.55)}
.card input{width:22px;height:22px;accent-color:#a855f7}
.card .i{flex:1}.card b{display:block}
.card small{color:var(--mut)}
.pr{color:var(--p2);font-weight:700;white-space:nowrap}
#bar{position:fixed;bottom:0;left:0;right:0;z-index:5;background:rgba(8,4,16,.95);border-top:1px solid var(--p);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(6px)}
#bar>div{max-width:760px;margin:0 auto}
.row{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;margin-bottom:4px}
.pg{height:7px;background:#1b1030;border-radius:9px;overflow:hidden;margin:4px 0 6px}
.pg i{display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#c084fc)}
.warn{color:var(--bad);font-weight:700;font-size:.88rem;margin-bottom:6px}
pre{white-space:pre-wrap;font:inherit;background:rgba(5,3,10,.8);border:1px dashed #6d28d9;border-radius:12px;padding:12px;margin:8px 0}
.mut{color:var(--mut);font-size:.85rem}
.cs{display:flex;flex-wrap:wrap;gap:10px}.cs label{margin:0;display:flex;gap:4px;align-items:center;color:var(--tx)}
.ft{text-align:center;margin-top:20px}
#qr svg{width:230px;height:230px;display:block}
a.btn{display:block;text-align:center;text-decoration:none;color:#fff;background:#15803d;border-radius:12px;padding:11px;margin-top:8px;font-weight:700}
.card.un{opacity:.45}
.card.un input{pointer-events:none}
</style>
</head>
<body>
<div id="bg"><svg preserveAspectRatio="xMidYMid slice"><defs><pattern id="pt" width="300" height="300" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)"><g fill="none" stroke="#8b3dff" stroke-width="2.2" stroke-linejoin="round" opacity=".42"><g transform="translate(20,30)"><path d="M30 20q-18 0-22 30l-6 40q-2 18 14 14l22-20h46l22 20q16 4 14-14l-6-40q-4-30-22-30z"/><path d="M36 48v22M25 59h22"/><circle cx="92" cy="50" r="5"/><circle cx="106" cy="62" r="5"/><circle cx="78" cy="62" r="5"/><circle cx="92" cy="74" r="5"/></g><g transform="translate(170,40)"><rect x="0" y="0" width="110" height="34" rx="9"/><path d="M12 17h40M80 17h18"/><circle cx="68" cy="17" r="4"/></g><g transform="translate(180,150)"><path d="M0 0h40l10 14h50v50H0z"/><circle cx="25" cy="38" r="9"/><path d="M60 30h28M60 44h28"/></g><g transform="translate(20,190)"><path d="M10 20q-10 0-10 12v30q0 12 10 12h30q10 0 10-12V32q0-12-10-12z"/><circle cx="25" cy="47" r="10"/><path d="M60 40h50"/></g></g></pattern></defs><rect width="100%" height="100%" fill="url(#pt)"/></svg></div>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script id="data" type="application/json">{"shop":{"name":"گیم‌نت کسری","open":true,"reopen":"","phone":"09012113920"},"games":[{"id":"a1","n":"EA FC 25","g":"ورزشی","c":["PS4","PS5","Xbox One S","Xbox One X","Xbox Series S","Xbox Series X"],"s":60,"p":150000},{"id":"a2","n":"God of War Ragnarök","g":"اکشن","c":["PS4","PS5"],"s":90,"p":200000},{"id":"a3","n":"Forza Horizon 5","g":"مسابقه‌ای","c":["Xbox One S","Xbox One X","Xbox Series S","Xbox Series X"],"s":110,"p":180000},{"id":"a4","n":"Resident Evil 4","g":"ترسناک","c":["PS4","PS5","Xbox Series S","Xbox Series X"],"s":55,"p":170000},{"id":"a5","n":"Spider-Man 2","g":"ماجراجویی","c":["PS5"],"s":100,"p":220000}]}</script>
<script>
const $=s=>document.querySelector(s),A=$('#app');
const D=JSON.parse($('#data').textContent);
try{if((/^#(kasra-panel|admin|panel)$/.test(location.hash)||sessionStorage.adm==='1')&&localStorage.draft)Object.assign(D,JSON.parse(localStorage.draft))}catch(x){}
const CN=['PS4','PS5','Xbox One S','Xbox One X','Xbox Series S','Xbox Series X'],GN=['اکشن','مسابقه‌ای','ورزشی','ماجراجویی','ترسناک'];
const CP=[[500,'۵۰۰ گیگابایت'],[1000,'۱ ترابایت'],[2000,'۲ ترابایت']];
const PASS='kasra developer 1355678896';
const TM=['ممنون که ما رو برای سرگرمی‌ات انتخاب کردی، خیلی خوشحالیم 💜','امیدواریم این بازی‌ها پر از لحظه‌های ناب و خنده برات بسازن.','دلت همیشه شاد و دستت همیشه روی دسته‌ی برنده باشه 🎮','سفارشت رسید؛ ما با عشق آماده‌ش می‌کنیم.','امروز یه بازی خوب، بهترین هدیه‌ایه که می‌تونی به خودت بدی.','مرسی که بهمون اعتماد کردی، قول می‌دیم پشیمون نشی.','آرزو می‌کنیم هر مرحله رو با یه لبخند تموم کنی.','خستگی روز رو با یه بازی قشنگ از تنت بیرون کن، حقته 🌙','تو فقط مشتری نیستی، جزئی از خانواده‌ی گیمرهای ما هستی.','امیدواریم بالاترین امتیازها همیشه مال تو باشه 🏆','لحظه‌های بازیت پر از هیجان و تموم‌نشدنی باشه.','یه دنیا ممنون! حضورت بهمون انرژی می‌ده ✨','هر بازی یه ماجراست؛ امیدواریم ماجراهای قشنگی پیش رو داشته باشی.','امشب بهترین شب بازی عمرت باشه 🎮','ممنون از وقتی که گذاشتی و انتخاب کردی.','زندگی هم مثل بازیه؛ امیدوارم همیشه از مرحله‌های سخت رد بشی و برنده باشی 💪','با هر بار بازی کردن، یه لبخند بیشتر نصیبت بشه.','خوشحالیم که بخشی از سرگرمی‌های تو هستیم.','امیدواریم هیچ‌وقت ذخیره‌ی بازیت پاک نشه و هیچ‌وقت لگ نکنی 😄','به‌خاطر انتخابت ازت قدردانیم.','این سفارش رو با دقت و دوست‌داشتن آماده می‌کنیم.','دلمون می‌خواد هر لحظه‌ی بازیت پر از شادی و رفاقت باشه.','امیدواریم کنار دوستان و خانواده‌ت کلی خوش بگذره.','آرزومندیم روزهات پر از خبرهای خوب و بردهای بزرگ باشه 🌟','تو باعث شدی روز ما قشنگ‌تر بشه، ممنون 💜','هر چی دلت می‌خواد همین‌جا منتظرته؛ هر وقت خواستی برگرد.','قهرمان واقعی کسیه که از بازی لذت می‌بره؛ لذتش مال تو!','امیدواریم همیشه سلامت، شاد و پرانرژی باشی.','مرسی که با ما بودی؛ منتظر دیدار دوباره‌ت هستیم 🎮','بازی خوش، دل خوش، روزگار خوش؛ به امید دیدار 💜'];
const fa=n=>(+n||0).toLocaleString('fa-IR',{maximumFractionDigits:1});
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dg=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
let C={step:0,sel:[],g:'همه',q:'',name:'',phone:''},ADM=false,OUT='',SENT=false,U=()=>{};
try{C={...C,...JSON.parse(sessionStorage.c||'{}')};ADM=sessionStorage.adm==='1'}catch{}
const sv=()=>{try{sessionStorage.c=JSON.stringify(C)}catch{}};
const gm=()=>D.games.filter(g=>C.sel.includes(g.id)&&g.a!==false);
const usable=()=>C.cap*.85;

function head(){const o=D.shop.open;return `<header><h1>🎮 ${e(D.shop.name)}</h1><span class="tag ${o?'on':'off'}">${o?'باز است':'بسته است'}</span></header>`}
function render(){
  U();U=()=>{};
  if(ADM)return admin();
  let h=head();
  if(!D.shop.open){h+=`<div class="box ban"><h2>😴 مغازه الان بسته است</h2>${D.shop.reopen?`<p>زمان بازگشایی: <b>${e(D.shop.reopen)}</b></p>`:''}<p class="mut">بعداً دوباره QR کد را اسکن کن.</p></div>`}
  else if(C.step==0)h+=`<div class="box"><h2>خوش اومدی! 👋</h2><label>اسم شما</label><input id="nm" value="${e(C.name)}" placeholder="مثلاً علی"><label>شماره تلفن</label><input id="ph" type="tel" inputmode="tel" value="${e(C.phone)}" placeholder="09123456789"><div id="er" class="warn"></div><button class="full" onclick="s0()">ادامه ←</button></div>`;
  else if(C.step==1)h+=`<div class="box"><h2>کنسولت کدومه؟ 🎮</h2><div class="opts">${CN.map(c=>`<button onclick="pk('console','${c}',2)">${c}</button>`).join('')}</div></div>`;
  else if(C.step==2)h+=`<div class="box"><h2>حافظه کنسول ${e(C.console)} چقدره؟ 💾</h2><div class="opts">${CP.map(c=>`<button onclick="pk('cap',${c[0]},3)">${c[1]}</button>`).join('')}</div><button class="g full" onclick="C.step=1;render()">→ بازگشت</button></div>`;
  else if(C.step==3){
    h+=`<div class="box"><div class="mut">${e(C.name)} | ${e(C.console)} | حافظه ${fa(C.cap)} گیگ (قابل‌استفاده تقریبی: ${fa(usable())} گیگ) <a href="#" onclick="C.step=1;C.sel=[];render();return false" style="color:var(--p2)">تغییر</a></div><input id="q" placeholder="🔍 جست‌وجوی بازی..." value="${e(C.q)}" style="margin-top:10px"><div class="chips">${['همه',...GN].map(g=>`<button class="chip ${C.g==g?'a':''}" onclick="C.g='${g}';sv();render()">${g}</button>`).join('')}</div></div><div id="lst"></div><div id="bar"></div>`;
  }else if(C.step==4)h+=`<div class="box"><h2>📋 سفارش شما آماده است</h2><pre>${e(OUT)}</pre><p class="mut">سفارش وقتی ثبت می‌شود که یکی از دکمه‌های زیر را بزنی و پیام را ارسال کنی.</p>${sm()}${wa()}<button class="g full" onclick="C.step=3;C.sel=[];sv();render()">سفارش جدید</button></div>`;
  A.innerHTML=h;
  if(C.step==3&&D.shop.open){drawList();drawBar();$('#q').oninput=x=>{C.q=x.target.value;sv();drawList()}}
}
function wa(){let p=dg(D.shop.phone||'').replace(/\D/g,'');if(!p)return'';p=p.replace(/^0/,'98');return `<a class="btn" onclick="arm()" target="_blank" rel="noopener" href="https://wa.me/${p}?text=${encodeURIComponent(OUT)}">ارسال با واتساپ</a>`}
function sm(){let p=dg(D.shop.phone||'').replace(/\D/g,'');if(!p)return'';p=p.replace(/^0/,'98');return `<a class="btn" style="background:#7c3aed" onclick="arm()" target="_blank" rel="noopener" href="sms:+${p}?&body=${encodeURIComponent(OUT)}">📱 ارسال سفارش با پیامک به مغازه</a>`}
function s0(){const n=$('#nm').value.trim(),p=dg($('#ph').value.trim()).replace(/\s|-/g,'');
  if(n.length<2)return $('#er').textContent='لطفاً اسمت را بنویس';
  if(!/^(\+98|0)?9\d{9}$/.test(p))return $('#er').textContent='شماره تلفن معتبر نیست (مثال: 09123456789)';
  C.name=n;C.phone=p;C.step=1;sv();render()}
function pk(k,v,s){C[k]=v;C.step=s;sv();render()}
function drawList(){
  const q=C.q.trim().toLowerCase();
  const L=D.games.filter(g=>g.c.includes(C.console)&&(C.g=='همه'||g.g==C.g)&&g.n.toLowerCase().includes(q));
  $('#lst').innerHTML=L.length?L.map(g=>`<label class="card ${g.a===false?'un':C.sel.includes(g.id)?'sel':''}" style="margin:0 0 8px;color:var(--tx);font-size:1rem"><input type="checkbox" ${g.a===false?'disabled':C.sel.includes(g.id)?'checked':''} onchange="tg('${g.id}',this)"><span class="i"><b>${e(g.n)}</b><small>${e(g.g)} • 💾 ${fa(g.s)} گیگ</small></span>${g.a===false?'<span class="pr" style="color:var(--bad)">ناموجود</span>':`<span class="pr">${fa(g.p)} تومان</span>`}</label>`).join(''):'<div class="box mut">بازی‌ای پیدا نشد.</div>'}
function tg(id,el){const i=C.sel.indexOf(id);i<0?C.sel.push(id):C.sel.splice(i,1);el.closest('.card').classList.toggle('sel',el.checked);sv();drawBar()}
function drawBar(){
  const S=gm(),pr=S.reduce((a,g)=>a+g.p,0),sz=S.reduce((a,g)=>a+g.s,0),u=usable(),over=sz>u;
  $('#bar').innerHTML=`<div>${over?`<div class="warn">⚠️ جا نمیشه! حجم بازی‌ها ${fa(sz-u)} گیگ بیشتر از فضای قابل‌استفاده‌ی کنسولته. یکی دو تا بازی رو حذف کن.</div>`:''}<div class="pg"><i style="width:${Math.min(100,sz/u*100)}%;${over?'background:var(--bad)':''}"></i></div><div class="row"><span>🎮 ${fa(S.length)} بازی</span><span>💾 حجم تقریبی: ${fa(sz)} از ${fa(u)} گیگ</span></div><div class="row"><span>💰 جمع کل:</span><b class="pr">${fa(pr)} تومان</b></div><button class="full" style="margin-top:4px" ${!S.length||over?'disabled':''} onclick="send()">ثبت و ارسال سفارش</button></div>`}
async function send(){
  const S=gm(),pr=S.reduce((a,g)=>a+g.p,0),sz=S.reduce((a,g)=>a+g.s,0),cp=CP.find(c=>c[0]==C.cap)[1];
  OUT=`📋 سفارش جدید\n👤 نام: ${C.name}\n📞 تلفن: ${C.phone}\n🎮 کنسول: ${C.console} (${cp})\n\n🕹️ بازی‌ها:\n${S.map(g=>`• ${g.n} — ${fa(g.s)} گیگ — ${fa(g.p)} تومان`).join('\n')}\n\n💾 حجم تقریبی: ${fa(sz)} گیگابایت\n💰 جمع کل: ${fa(pr)} تومان`;
  SENT=false;
  
  C.step=4;C.out=OUT;C.msg=TM[Math.random()*TM.length|0];C.due=0;sv();render()}

/* ---------- admin ---------- */
function ap(){if(sessionStorage.adm==='1'){ADM=true;return render()}
  A.innerHTML=head()+`<div class="box"><h2>🔐 ورود به پنل مدیریت</h2><label>رمز</label><input id="pw" type="password" placeholder="رمز را وارد کن"><div id="er" class="warn"></div><button class="full" onclick="lg()">ورود</button><button class="g full" onclick="location.hash='';render()">بازگشت</button></div>`}
function lg(){if($('#pw').value.trim()===PASS){ADM=true;try{sessionStorage.adm='1';localStorage.draft&&Object.assign(D,JSON.parse(localStorage.draft))}catch(x){}render()}else $('#er').textContent='رمز اشتباه است'}
function sd(){try{localStorage.draft=JSON.stringify(D)}catch(x){}render()}
function col(){if($('#sn'))D.shop={name:$('#sn').value.trim()||'مغازه',open:$('#so').checked,reopen:$('#sr').value.trim(),phone:$('#sp').value.trim()}}
function admin(){
  const s=D.shop,dr=!!localStorage.draft;
  A.innerHTML=`<header><h1>⚙️ پنل مدیریت</h1><button class="g" onclick="ADM=false;try{sessionStorage.adm='0'}catch(x){};location.hash='';render()">خروج</button></header>
  <div class="box ${dr?'ban':''}"><h2>💾 اعمال تغییرات روی سایت</h2><p class="mut">تغییرات پنل فقط روی همین گوشی ذخیره می‌شوند. برای اینکه مشتری‌ها ببینند: دکمه‌ی زیر را بزن، فایل <b>index.html</b> دانلود می‌شود، آن را در گیت‌هاب جایگزین فایل قبلی کن (Add file ← Upload files).</p><button class="full" onclick="dlf()">دانلود فایل به‌روز (index.html)</button>${dr?'<button class="g full" onclick="if(confirm(\'همه‌ی تغییرات اعمال‌نشده پاک شود؟\')){localStorage.removeItem(\'draft\');location.reload()}">برگرداندن به نسخه‌ی فایل</button>':''}</div>
  <div class="box"><h2>🏪 مغازه</h2><label>اسم مغازه</label><input id="sn" value="${e(s.name)}"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="so" ${s.open?'checked':''}> مغازه الان باز است</label><label>زمان بازگشایی (وقتی بسته است)</label><input id="sr" value="${e(s.reopen)}" placeholder="مثلاً امروز ساعت ۱۶"><label>شماره مغازه (سفارش‌ها به این شماره پیامک می‌شود)</label><input id="sp" type="tel" value="${e(s.phone)}"><button class="full" onclick="col();sd()">ذخیره</button></div>
  <div class="box"><h2>➕ افزودن بازی</h2><label>اسم بازی</label><input id="gn"><label>ژانر</label><select id="gg">${GN.map(g=>`<option>${g}</option>`).join('')}</select><label>کنسول‌ها</label><div class="cs">${CN.map(c=>`<label><input type="checkbox" class="gc" value="${c}"> ${c}</label>`).join('')}</div><label>حجم (گیگابایت)</label><input id="gs" type="number" inputmode="decimal"><label>قیمت (تومان)</label><input id="gp" type="number" inputmode="numeric"><div id="er" class="warn"></div><button class="full" onclick="add()">افزودن بازی</button></div>
  <div class="box"><h2>🕹️ بازی‌ها (${fa(D.games.length)})</h2>${D.games.map(g=>`<div class="card" style="cursor:default;flex-wrap:wrap"><span class="i"><b>${e(g.n)}</b><small>${e(g.g)} • ${g.c.join('، ')} • ${fa(g.s)} گیگ • ${fa(g.p)} تومان</small></span><button class="${g.a===false?'d':'g'}" onclick="av('${g.id}')">${g.a===false?'ناموجود':'موجود'}</button><button class="g" onclick="ep('${g.id}')">قیمت</button><button class="d" onclick="del('${g.id}')">حذف</button></div>`).join('')||'<p class="mut">هنوز بازی‌ای نیست</p>'}</div>
  <div class="box"><h2>📱 QR کد منوی مشتری</h2><div id="qr" style="background:#fff;padding:10px;border-radius:12px;width:fit-content;margin:8px auto"></div><label>لینک منو (به مشتری بده)</label><input id="sl" readonly value="${location.origin+location.pathname}" onclick="this.select()"><button class="g full" onclick="dlq()">دانلود QR کد</button></div>`;
  try{const q=qrcode(0,'M');q.addData(location.origin+location.pathname);q.make();$('#qr').innerHTML=q.createSvgTag(6,0)}catch(x){}}
function add(){const n=$('#gn').value.trim(),c=[...document.querySelectorAll('.gc:checked')].map(x=>x.value),s=parseFloat($('#gs').value),p=parseInt($('#gp').value);
  if(!n||!c.length||!(s>0)||isNaN(p)||p<0)return $('#er').textContent='اسم، کنسول، حجم و قیمت را کامل پر کن';
  col();D.games.push({id:'g'+Date.now().toString(36),n,g:$('#gg').value,c,s,p,a:true});sd()}
function del(id){if(confirm('این بازی حذف شود؟')){col();D.games=D.games.filter(g=>g.id!=id);sd()}}
function av(id){col();const g=D.games.find(x=>x.id==id);g.a=g.a===false;sd()}
function ep(id){const g=D.games.find(x=>x.id==id),p=parseInt(dg(prompt('قیمت جدید (تومان)',g.p)||''));if(!isNaN(p)&&p>=0){col();g.p=p;sd()}}
function dl(b,n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:t}));a.download=n;a.click()}
function dlq(){const v=$('#qr svg');if(!v)return;const x=v.cloneNode(true);x.setAttribute('xmlns','http://www.w3.org/2000/svg');dl(x.outerHTML,'menu-qr.svg','image/svg+xml')}
function dlf(){col();const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';const t=c.querySelector('#thx');t&&t.remove();c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');dl('<!DOCTYPE html>\n'+c.outerHTML,'index.html','text/html')}
function arm(){if(C.due)return;C.due=Date.now()+5000;sv();setTimeout(thx,5000)}
function thx(){if(C.step!=4||!C.due||Date.now()<C.due-300||$('#thx'))return;const d=document.createElement('div');d.id='thx';d.style.cssText='position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;background:rgba(5,3,10,.97);overflow:auto';d.innerHTML=`<div style="font-size:3.4rem">💜</div><h2 style="color:var(--p2);font-size:1.5rem;text-shadow:0 0 18px var(--p)">ممنون ${e(C.name)} عزیز!</h2><p style="font-size:1.15rem;line-height:2;max-width:420px">${e(C.msg)}</p><button class="g" style="margin-top:18px" onclick="done()">سفارش جدید 🎮</button>`;document.body.appendChild(d)}
function done(){C.step=3;C.sel=[];C.due=0;sv();const t=$('#thx');t&&t.remove();render()}
document.addEventListener('visibilitychange',()=>{document.visibilityState==='visible'&&thx()});
function route(){OUT=OUT||C.out||'';C.step==4&&C.due&&setTimeout(thx,Math.max(0,C.due-Date.now()));/^#(kasra-panel|admin|panel)$/.test(location.hash)&&!ADM?ap():render()}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
