<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Menu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap">
<style>
:root{--bg:#05030a;--p:#8b3dff;--p2:#c084fc;--card:rgba(14,7,26,.78);--tx:#f3eaff;--mut:#a995c9;--bad:#ff5d7a;--ok:#4ade80;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif}
body{min-height:100vh}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 50% 0,rgba(139,61,255,.28),transparent 60%)}
#bg svg{width:100%;height:100%}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:14px 14px 130px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h1{font-size:1.4rem;margin:0;color:var(--p2);text-shadow:0 0 18px var(--p)}
h2{font-size:1.1rem;margin:0 0 10px}
.tag{padding:3px 12px;border-radius:99px;font-size:.8rem;font-weight:700;border:1px solid}
.on{color:var(--ok);border-color:var(--ok)}.off{color:var(--bad);border-color:var(--bad)}
.box{background:var(--card);border:1px solid #5b21b6;border-radius:16px;padding:16px;margin-bottom:12px;backdrop-filter:blur(3px)}
.ban{border-color:var(--bad);color:#ffc2cd}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #6d28d9;background:rgba(5,3,10,.8);color:var(--tx);font:inherit}
input[type=checkbox]{width:auto}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 18px;color:#fff;background:linear-gradient(135deg,#7c3aed,#a855f7);font-weight:700;box-shadow:0 0 14px rgba(139,61,255,.5)}
button:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
button.g{background:transparent;border:1px solid #6d28d9;box-shadow:none;color:var(--p2)}
button.d{background:#7f1d3a;box-shadow:none;padding:6px 10px;font-size:.8rem}
.full{width:100%;margin-top:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{padding:18px 8px;font-size:1.05rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.chip{white-space:nowrap;padding:6px 14px;border-radius:99px;border:1px solid #6d28d9;background:rgba(5,3,10,.7);color:var(--p2);box-shadow:none}
.chip.a{background:#7c3aed;color:#fff}
.card{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #4c1d95;border-radius:14px;margin-bottom:8px;background:var(--card);cursor:pointer}
.card.sel{border-color:var(--p2);box-shadow:0 0 14px rgba(168,85,247,.55)}
.card input{width:22px;height:22px;accent-color:#a855f7}
.card .i{flex:1}.card b{display:block}
.card small{color:var(--mut)}
.pr{color:var(--p2);font-weight:700;white-space:nowrap}
#bar{position:fixed;bottom:0;left:0;right:0;z-index:5;background:rgba(8,4,16,.95);border-top:1px solid var(--p);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(6px)}
#bar>div{max-width:760px;margin:0 auto}
.row{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;margin-bottom:4px}
.pg{height:7px;background:#1b1030;border-radius:9px;overflow:hidden;margin:4px 0 6px}
.pg i{display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#c084fc)}
.warn{color:var(--bad);font-weight:700;font-size:.88rem;margin-bottom:6px}
pre{white-space:pre-wrap;font:inherit;background:rgba(5,3,10,.8);border:1px dashed #6d28d9;border-radius:12px;padding:12px;margin:8px 0}
.mut{color:var(--mut);font-size:.85rem}
.cs{display:flex;flex-wrap:wrap;gap:10px}.cs label{margin:0;display:flex;gap:4px;align-items:center;color:var(--tx)}
.ft{text-align:center;margin-top:20px}
#qr svg{width:230px;height:230px;display:block}
a.btn{display:block;text-align:center;text-decoration:none;color:#fff;background:#15803d;border-radius:12px;padding:11px;margin-top:8px;font-weight:700}
.card.un{opacity:.45}
.card.un input{pointer-events:none}
</style>
</head>

  const L=D.games.filter(g=>g.c.includes(C.console)&&(C.g=='همه'||g.g==C.g)&&g.n.toLowerCase().includes(q));
  $('#lst').innerHTML=L.length?L.map(g=>`<label class="card ${g.a===false?'un':C.sel.includes(g.id)?'sel':''}" style="margin:0 0 8px;color:var(--tx);font-size:1rem"><input type="checkbox" ${g.a===false?'disabled':C.sel.includes(g.id)?'checked':''} onchange="tg('${g.id}',this)"><span class="i"><b>${e(g.n)}</b><small>${e(g.g)} • 💾 ${fa(g.s)} گیگ</small></span>${g.a===false?'<span class="pr" style="color:var(--bad)">ناموجود</span>':`<span class="pr">${fa(g.p)} تومان</span>`}</label>`).join(''):'<div class="box mut">بازی‌ای پیدا نشد.</div>'}
function tg(id,el){const i=C.sel.indexOf(id);i<0?C.sel.push(id):C.sel.splice(i,1);el.closest('.card').classList.toggle('sel',el.checked);sv();drawBar()}
function drawBar(){
  const S=gm(),pr=S.reduce((a,g)=>a+g.p,0),sz=S.reduce((a,g)=>a+g.s,0),u=usable(),over=sz>u;
  $('#bar').innerHTML=`<div>${over?`<div class="warn">⚠️ جا نمیشه! حجم بازی‌ها ${fa(sz-u)} گیگ بیشتر از فضای قابل‌استفاده‌ی کنسولته. یکی دو تا بازی رو حذف کن.</div>`:''}<div class="pg"><i style="width:${Math.min(100,sz/u*100)}%;${over?'background:var(--bad)':''}"></i></div><div class="row"><span>🎮 ${fa(S.length)} بازی</span><span>💾 حجم تقریبی: ${fa(sz)} از ${fa(u)} گیگ</span></div><div class="row"><span>💰 جمع کل:</span><b class="pr">${fa(pr)} تومان</b></div><button class="full" style="margin-top:4px" ${!S.length||over?'disabled':''} onclick="send()">ثبت و ارسال سفارش</button></div>`}
async function send(){
  const S=gm(),pr=S.reduce((a,g)=>a+g.p,0),sz=S.reduce((a,g)=>a+g.s,0),cp=CP.find(c=>c[0]==C.cap)[1];
  OUT=`📋 سفارش جدید\n👤 نام: ${C.name}\n📞 تلفن: ${C.phone}\n🎮 کنسول: ${C.console} (${cp})\n\n🕹️ بازی‌ها:\n${S.map(g=>`• ${g.n} | قیمت: ${pf(g.p)}`).join('\n')}\n\n💾 حجم تقریبی: حدود ${fa(Math.round(sz/10)*10)} گیگابایت\n💰 جمع کل: ${pf(pr)}`;
  SENT=false;
  
  C.step=4;C.out=OUT;C.msg=TM[Math.random()*TM.length|0];C.due=0;sv();render()}

/* ---------- admin ---------- */
function ap(){if(sessionStorage.adm==='1'){ADM=true;return render()}
  A.innerHTML=head()+`<div class="box"><h2>🔐 ورود به پنل مدیریت</h2><label>رمز</label><input id="pw" type="password" placeholder="رمز را وارد کن"><div id="er" class="warn"></div><button class="full" onclick="lg()">ورود</button><button class="g full" onclick="location.hash='';render()">بازگشت</button></div>`}
function lg(){if($('#pw').value.trim()===PASS){ADM=true;try{sessionStorage.adm='1';localStorage.draft2&&Object.assign(D,JSON.parse(localStorage.draft2))}catch(x){}render()}else $('#er').textContent='رمز اشتباه است'}
function sd(){try{localStorage.draft2=JSON.stringify(D)}catch(x){}render()}
function col(){if($('#sn'))D.shop={name:$('#sn').value.trim()||'مغازه',phone:$('#sp').value.trim()}}
function admin(){
  const s=D.shop,dr=!!localStorage.draft2;
  A.innerHTML=`<header><h1>⚙️ پنل مدیریت</h1><button class="g" onclick="ADM=false;try{sessionStorage.adm='0'}catch(x){};location.hash='';render()">خروج</button></header>
  <div class="box ${dr?'ban':''}"><h2>💾 اعمال تغییرات روی سایت</h2><p class="mut">تغییرات پنل فقط روی همین گوشی ذخیره می‌شوند. برای اینکه مشتری‌ها ببینند: دکمه‌ی زیر را بزن، فایل <b>game.menu.html</b> دانلود می‌شود، آن را در گیت‌هاب جایگزین فایل قبلی کن (Add file ← Upload files).</p><button class="full" onclick="dlf()">دانلود فایل به‌روز (game.menu.html)</button>${dr?'<button class="g full" onclick="if(confirm(\'همه‌ی تغییرات اعمال‌نشده پاک شود؟\')){localStorage.removeItem(\'draft2\');location.reload()}">برگرداندن به نسخه‌ی فایل</button>':''}</div>
  <div class="box"><h2>🏪 مغازه</h2><label>اسم مغازه</label><input id="sn" value="${e(s.name)}"><label>شماره مغازه (سفارش‌ها به این شماره پیامک می‌شود)</label><input id="sp" type="tel" value="${e(s.phone)}"><button class="full" onclick="col();sd()">ذخیره</button></div>
  <div class="box"><h2>➕ افزودن بازی</h2><label>اسم بازی</label><input id="gn"><label>ژانر</label><select id="gg">${GN.map(g=>`<option>${g}</option>`).join('')}</select><label>کنسول‌ها</label><div class="cs">${CN.map(c=>`<label><input type="checkbox" class="gc" value="${c}"> ${c}</label>`).join('')}</div><label>حجم (گیگابایت)</label><input id="gs" type="number" inputmode="decimal"><label>قیمت (تومان)</label><input id="gp" type="number" inputmode="numeric"><div id="er" class="warn"></div><button class="full" onclick="add()">افزودن بازی</button></div>
  <div class="box"><h2>🕹️ بازی‌ها (${fa(D.games.length)})</h2>${D.games.map(g=>`<div class="card" style="cursor:default;flex-wrap:wrap"><span class="i"><b>${e(g.n)}</b><small>${e(g.g)} • ${g.c.join('، ')} • ${fa(g.s)} گیگ • ${fa(g.p)} تومان</small></span><button class="${g.a===false?'d':'g'}" onclick="av('${g.id}')">${g.a===false?'ناموجود':'موجود'}</button><button class="g" onclick="ep('${g.id}')">قیمت</button><button class="d" onclick="del('${g.id}')">حذف</button></div>`).join('')||'<p class="mut">هنوز بازی‌ای نیست</p>'}</div>
  <div class="box"><h2>📱 QR کد منوی مشتری</h2><div id="qr" style="background:#fff;padding:10px;border-radius:12px;width:fit-content;margin:8px auto"></div><label>لینک منو (به مشتری بده)</label><input id="sl" readonly value="${location.origin+location.pathname}" onclick="this.select()"><button class="g full" onclick="dlq()">دانلود QR کد</button></div>`;
  try{const q=qrcode(0,'M');q.addData(location.origin+location.pathname);q.make();$('#qr').innerHTML=q.createSvgTag(6,0)}catch(x){}}
function add(){const n=$('#gn').value.trim(),c=[...document.querySelectorAll('.gc:checked')].map(x=>x.value),s=parseFloat($('#gs').value),p=parseInt($('#gp').value);
  if(!n||!c.length||!(s>0)||isNaN(p)||p<0)return $('#er').textContent='اسم، کنسول، حجم و قیمت را کامل پر کن';
  col();D.games.push({id:'g'+Date.now().toString(36),n,g:$('#gg').value,c,s,p,a:true});sd()}
function del(id){if(confirm('این بازی حذف شود؟')){col();D.games=D.games.filter(g=>g.id!=id);sd()}}
function av(id){col();const g=D.games.find(x=>x.id==id);g.a=g.a===false;sd()}
function ep(id){const g=D.games.find(x=>x.id==id),p=parseInt(dg(prompt('قیمت جدید (تومان)',g.p)||''));if(!isNaN(p)&&p>=0){col();g.p=p;sd()}}
function dl(b,n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:t}));a.download=n;a.click()}
function dlq(){const v=$('#qr svg');if(!v)return;const x=v.cloneNode(true);x.setAttribute('xmlns','http://www.w3.org/2000/svg');dl(x.outerHTML,'menu-qr.svg','image/svg+xml')}
function dlf(){col();const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';const t=c.querySelector('#thx');t&&t.remove();c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');dl('<!DOCTYPE html>\n'+c.outerHTML,'game.menu.html','text/html')}
function arm(){if(C.due)return;C.due=Date.now()+5000;sv();setTimeout(thx,5000)}
function thx(){if(C.step!=4||!C.due||Date.now()<C.due-300||$('#thx'))return;const d=document.createElement('div');d.id='thx';d.style.cssText='position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;background:rgba(5,3,10,.97);overflow:auto';d.innerHTML=`<div style="font-size:3.4rem">💜</div><h2 style="color:var(--p2);font-size:1.5rem;text-shadow:0 0 18px var(--p)">ممنون ${e(C.name)} عزیز!</h2><p style="font-size:1.15rem;line-height:2;max-width:420px">${e(C.msg)}</p><button class="g" style="margin-top:18px" onclick="done()">سفارش جدید 🎮</button>`;document.body.appendChild(d)}
function done(){C.step=3;C.sel=[];C.due=0;sv();const t=$('#thx');t&&t.remove();render()}
document.addEventListener('visibilitychange',()=>{document.visibilityState==='visible'&&thx()});
function route(){OUT=OUT||C.out||'';C.step==4&&C.due&&setTimeout(thx,Math.max(0,C.due-Date.now()));/^#(kasra-panel|admin|panel)$/.test(location.hash)&&!ADM?ap():render()}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
